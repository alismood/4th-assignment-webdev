<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-4">
        <a class="navbar-brand" href="#">Navbar</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#email">Email</a></li>
                <li class="nav-item"><a class="nav-link" href="#message">Message</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </div>

    </nav>


    <!-- Form -->
     <section class="mt-5 p-5 contact-section" id="contact">
        <div class="container">
            <div class="contact-card p-5 shadow-lg rounded">
                <!-- Contact Card  -->

                <h2 class="text-center fw-bold text-primary">Get in Touch</h2>
                <h1 class="text-center mb-4 fw-bold text-primary">Contact Us</h1>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="contact-card-header">
                            
                            
                            <form action="">
                                <fieldset class="border  p-4">
                                    <legend class="legend-form fw-bold">Personal Information</legend>

                                    <!-- Name -->
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <label for="name" class="form-label fw-semi-bold">Name:</label><br>
                                            <input type="text" id="name" placeholder="Enter your name" class="form-control mb-3" required><br>
                                        </div>
                                    </div>        
                                    <!-- Email -->
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <label for="email" class="form-label fw-semi-bold">Email:</label><br>
                                            <input type="email" id="email" placeholder="Enter your email" class="form-control" required>
                                            <div id="emailHelp" class="form-text mb-5">We’ll never share your email with anyone else.</div> <!-- Pure text-->
                                        </div>
                                    </div>

                                    <!-- Textarea -->
                                    <div class="row ">
                                        <div class="col-lg-6">
                                            <label for="message" class="form-label fw-semi-bold">Message:</label><br>
                                    <textarea id="message" placeholder="Enter your message" class="form-control mb-3 col-lg-6" maxlength="50" cols="12" rows="4"></textarea><br>
                                        </div>
                                    </div>

                                    <label for="rating" class="form-label fw-semi-bold">Rate our website</label><br>
                                    <input list="rating" class="form-control mb-3" size="20" required>
                                    <datalist id="rating" >
                                        <option value="5">
                                        <option value="4">
                                        <option value="3">
                                        <option value="2">
                                        <option value="1">
                                    </datalist><br>

                                    <input type="submit" class="btn btn-primary" value="Submit">
                                    <input type="reset" class="btn btn-secondary" value="Reset">
                                </fieldset>
                            </form>
                        </div>
                    </div><!--col-lg-6-->

                    <div class="col-lg-6">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2259.3792576489577!2d71.41725322161444!3d51.090128872723675!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x424585a605525605%3A0x4dff4a1973f7567e!2sAstana%20IT%20University!5e1!3m2!1sru!2skz!4v1791738328546!5m2!1sru!2skz"  allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>

                </div>
            </div>
        </div>
     </section>
</body>
</html>
