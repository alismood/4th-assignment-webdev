<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</head>
<body class="container mt-5">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-4">
        <a class="navbar-brand" href="#">Navbar</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#email">Email</a></li>
                <li class="nav-item"><a class="nav-link" href="#message">Message</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </div>

    </nav>


    <!-- Form -->
    <form>
        <fieldset class="border  p-4">
            <legend>Personal Information</legend>

            <label for="name" class="form-label">Name:</label><br>
            <input type="text" id="name" placeholder="Enter your name" class="mb-3" required><br>
            

            <label for="email" class="form-label">Email:</label><br>
            <input type="email" id="email" placeholder="Enter your email" class="mb">
            <div id="emailHelp" class="form-text mb-5">We’ll never share your email with anyone else.</div>

            <textarea id="message" placeholder="Enter your message" class="mb-3" maxlength="20" style="height: 100px; width: 30%;"></textarea><br>

            <label for="rating">Rate our website</label><br>
            <input list="rating" class="mb-3" size="20">
            <datalist id="rating" >
                <option value="5">
                <option value="4">
                <option value="3">
                <option value="2">
                <option value="1">
            </datalist><br>

            <input type="submit" class="btn btn-primary" value="Submit">
            <input type="reset" class="btn btn-secondary" value="Reset">
        </fieldset>
    </form>

    <div>

    
    </div>
</body>
</html>
